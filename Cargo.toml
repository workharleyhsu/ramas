[package]
name = "ramas"
version = "0.1.0"
edition = "2024"
description = "Interactive tree-style disk usage analyzer for the Linux terminal"
license = "MIT OR Apache-2.0"
authors = ["HarleyHsu <270751439+workharleyhsu@users.noreply.github.com>"]
readme = "README.md"
keywords = ["tui", "disk", "ncdu", "terminal", "linux"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
clap_mangen = "0.3.4"
crossterm = "0.29.0"
dirs = "7.0.0"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
rayon = "1.12.0"
rustix = { version = "1.1.6", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.1"
trash = "5.4.0"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
